
name: Build PrimalRealms

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget https://services.gradle.org/distributions/gradle-8.14-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.14/bin/gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrimalRealms-plugin
          path: build/libs/*.jar
