name: PrimalRealms
version: '0.1.0'
main: com.primalrealms.PrimalRealmsPlugin
api-version: '1.21'
description: Environmental powers and kill-based Energy progression.
author: PrimalRealms

commands:
  primal:
    description: Main PrimalRealms command.
    usage: /primal help
    aliases: [pr]
  ability:
    description: Activate your affinity abilities.
    usage: /ability <1|2>
  energy:
    description: View your current Primal Energy.
    usage: /energy
  trust:
    description: Prevent your abilities from affecting a player.
    usage: /trust <player>
  untrust:
    description: Allow your abilities to affect a previously trusted player.
    usage: /untrust <player>

permissions:
  primal.admin:
    description: Manage PrimalRealms players and Energy.
    default: op
